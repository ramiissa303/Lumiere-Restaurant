<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Lumière</title>
  <meta name="description" content="A visual portrait of Lumière — food, interiors, events and chef's moments. Explore our gallery in an immersive lightbox." />
  <meta name="theme-color" content="#1c1410" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>(function(){try{var t=localStorage.getItem('lumiere-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-mark serif">Lumi<span>è</span>re</div>
    <div class="loader-bar"></div>
    <div class="loader-tagline">Fine Dining · Est. 2012</div>
  </div>
  <div data-partial="header"></div>

  <main id="main">
    <header class="page-hero" style="min-height:52vh">
      <div class="page-hero__bg"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1600&h=900&fit=crop&auto=format" alt="Lumière dining room" /></div>
      <div class="container">
        <span class="eyebrow page-hero__eyebrow eyebrow--left">A Visual Portrait</span>
        <h1 class="serif">The <em>Gallery</em></h1>
        <p>A glimpse behind the doors of Lumière — plates, rooms, celebrations and the quiet artistry of the pass.</p>
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span>Gallery</span></nav>
      </div>
    </header>

    <section class="section">
      <div class="container-wide">
        <div class="gallery-filter" id="galleryFilter">
          <button class="menu-cat active" data-filter="all">All</button>
          <button class="menu-cat" data-filter="food">Food</button>
          <button class="menu-cat" data-filter="interior">Interior</button>
          <button class="menu-cat" data-filter="events">Events</button>
          <button class="menu-cat" data-filter="chef">Chef Moments</button>
        </div>
        <div class="masonry" id="masonry"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lightbox-btn lightbox-close" id="lbClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
    <button class="lightbox-btn lightbox-prev" id="lbPrev" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <img class="lightbox-img" id="lbImg" src="" alt="" />
    <button class="lightbox-btn lightbox-next" id="lbNext" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="lightbox-cap" id="lbCap"></div>
  </div>

  <div data-partial="footer"></div>
  <script src="assets/js/partials.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/gallery.js" defer></script>
</body>
</html>
